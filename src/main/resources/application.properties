spring.application.name=BRP-backend
spring.profiles.active=dev

spring.data.mongodb.authentication-database=${MONGODB_AUTH_DATABASE}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.uri=${MONGODB_URI}

sms.account_sid=${TWILIO_ACCOUNT_SID}
sms.auth.token=${TWILIO_AUTH_TOKEN}
sms.phoneNumber=${TWILIO_PHONE_NUMBER}
payment.api.key=${PAYSTACK_API_KEY}

server.ssl.key-store=${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.trust-store=${SSL_TRUST_STORE}
server.ssl.trust-store-password=${SSL_TRUST_STORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE}
server.ssl.key-alias=${SSL_KEY_ALIAS}


